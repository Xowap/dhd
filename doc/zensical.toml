[project]
site_name = "DHD — Dial Hifi Device"
site_url = "https://offworld-nexus-dhd.surge.sh"
site_description = "A physical motorized fader for seamless computer volume control"
repo_url = "https://github.com/Xowap/dhd"
repo_name = "Xowap/dhd"

extra_javascript = [
    "javascripts/mathjax.js",
    "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
    {"Home" = "index.md"},
    {"Assembly" = [
        "assembly/index.md",
        {"Bill of Materials" = "assembly/bom.md"},
        {"PCB & Soldering" = "assembly/pcb.md"},
        {"3D Printing" = "assembly/printing.md"},
        {"Physical Assembly" = "assembly/steps.md"},
        {"GEN2 Integration" = "assembly/gen2.md"},
    ]},
    {"Host Software" = [
        {"Installation" = "host/installation.md"},
        {"Usage" = "host/usage.md"},
        {"Protocol Reference" = "host/protocol.md"},
    ]},
    {"Internals" = [
        {"PID Control System" = "internals/pid.md"},
        {"Motor Driver (DRV8833)" = "internals/drv8833.md"},
        {"Wiring Reference" = "internals/wiring.md"},
    ]},
]

[project.theme]
name = "material"
palette = [
    { scheme = "default", primary = "deep purple", accent = "amber", toggle = { icon = "lucide/sun", name = "Switch to dark mode" } },
    { scheme = "slate", primary = "deep purple", accent = "amber", toggle = { icon = "lucide/moon", name = "Switch to light mode" } },
]
features = [
    "navigation.sections",
    "navigation.expand",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "content.code.copy",
]
icon = { repo = "fontawesome/brands/github" }

[[project.plugins]]
name = "search"


[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
